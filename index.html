
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy - Order Food Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero">

        <!-- Navbar -->
        <nav class="navbar">

            <div class="logo">
                <span class="logo-icon">S</span>
                <h2>Swiggy</h2>
            </div>

            <div class="nav-links">
                <a href="#">Swiggy Corporate</a>
                <a href="#">Partner with us</a>
                <a href="#" class="app-btn">Get the App ↗</a>
                <a href="#" class="signin-btn">Sign in</a>
            </div>

        </nav>

        <!-- Side Images -->
        <img
            src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500"
            class="side-img left-img"
            alt="Fresh vegetables"
        >

        <img
            src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500"
            class="side-img right-img"
            alt="Sushi food"
        >

        <!-- Main Content -->
        <div class="hero-content">

            <h1>
                Order food & groceries. Discover<br>
                best restaurants. Swiggy it!
            </h1>

            <!-- Search Boxes -->
            <div class="search-container">

                <div class="search-box location">
                    <span class="location-icon">📍</span>
                    <input
                        type="text"
                        placeholder="Enter your delivery location"
                    >
                    <span>⌄</span>
                </div>

                <div class="search-box restaurant">
                    <input
                        type="text"
                        placeholder="Search for restaurant, item or more"
                    >
                    <span>⌕</span>
                </div>

            </div>

            <!-- Service Cards -->
            <div class="cards">

                <!-- Food Delivery -->
                <div class="card">
                    <h2>FOOD DELIVERY</h2>
                    <p>FROM RESTAURANTS</p>
                    <span class="offer">UPTO 60% OFF</span>

                    <div class="arrow">→</div>

                    <img
                        src="https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=400"
                        alt="Food delivery"
                    >
                </div>

                <!-- Instamart -->
                <div class="card">
                    <h2>INSTAMART</h2>
                    <p>INSTANT GROCERY</p>
                    <span class="offer">UPTO 60% OFF</span>

                    <div class="arrow">→</div>

                    <img
                        src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=400"
                        alt="Grocery basket"
                    >
                </div>

                <!-- Dineout -->
                <div class="card">
                    <h2>DINEOUT</h2>
                    <p>EAT OUT & SAVE MORE</p>
                    <span class="offer">UPTO 50% OFF</span>

                    <div class="arrow">→</div>

                    <img
                        src="https://images.unsplash.com/photo-1515003197210-e0cd7184f8b5?w=400"
                        alt="Restaurant dining"
                    >
                </div>

            </div>

        </div>

    </section>

</body>
</html>
